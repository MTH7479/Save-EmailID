<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Copy Email ID</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 12px; font-size: 14px; }
    button { width: 100%; padding: 10px; font-size: 15px; cursor: pointer;
             background: #0078d4; color: #fff; border: none; border-radius: 4px; margin-bottom: 8px; }
    button:hover { background: #106ebe; }
    .label { font-weight: 600; margin-top: 10px; }
    textarea { width: 100%; height: 70px; direction: ltr; text-align: left;
               font-family: Consolas, monospace; font-size: 11px; box-sizing: border-box; }
    #status { margin-top: 8px; color: #107c10; min-height: 18px; }
    .err { color: #a80000 !important; }
  </style>
</head>
<body>
  <button id="btnRest">העתק EmailId (Graph / REST)</button>
  <button id="btnEws">העתק EWS ItemId</button>
  <button id="btnInternet">העתק Internet Message-Id</button>

  <div class="label">Graph / REST Id</div>
  <textarea id="restId" readonly></textarea>

  <div class="label">EWS ItemId</div>
  <textarea id="ewsId" readonly></textarea>

  <div class="label">Internet Message-Id</div>
  <textarea id="netId" readonly></textarea>

  <div id="status"></div>
  <script src="taskpane.js"></script>
</body>
</html>
